  <text x="96" y="136" fill="#95B9CE" font-family="Helvetica, Arial, sans-serif" font-size="20">Prooflane separates public evidence from</text>
  <text x="96" y="164" fill="#95B9CE" font-family="Helvetica, Arial, sans-serif" font-size="20">private runtime artifacts on purpose.</text>
  <rect x="120" y="210" width="1200" height="530" rx="34" fill="#0E2435" stroke="#254C64"/>

  <rect x="172" y="268" width="1096" height="94" rx="24" fill="#12324A"/>
