  <text x="218" y="348" fill="#EAF6FF" font-family="Helvetica, Arial, sans-serif" font-size="18">README, get-started, FAQ, and the first-look path</text>

  <rect x="172" y="390" width="1096" height="94" rx="24" fill="#113047"/>
  <text x="218" y="442" fill="#FF8A00" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">2. Contract truth</text>
  <text x="218" y="470" fill="#EAF6FF" font-family="Helvetica, Arial, sans-serif" font-size="18">Architecture, API, CI governance, and public-boundary docs</text>

  <rect x="172" y="512" width="1096" height="94" rx="24" fill="#102C42"/>
  <text x="218" y="564" fill="#FFD166" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">3. Public-safe artifacts</text>
