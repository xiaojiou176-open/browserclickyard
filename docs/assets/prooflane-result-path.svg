  <text x="1012" y="396" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Run pnpm mcp:start</text>
  <text x="1012" y="436" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Expose the core tool surface</text>
  <text x="1012" y="476" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Reuse the same governed runtime</text>
