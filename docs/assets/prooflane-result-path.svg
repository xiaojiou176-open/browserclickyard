  <text x="132" y="356" fill="#F7FBFF" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">See the product</text>
  <text x="132" y="396" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Run ./scripts/dev-up.sh</text>
  <text x="132" y="436" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Open the Command Center</text>
  <text x="132" y="476" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Inspect the API locally</text>
  <text x="572" y="356" fill="#F7FBFF" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Run governed proof</text>
  <text x="572" y="396" fill="#9AC0D5" font-family="Helvetica, Arial, sans-serif" font-size="22">Run pnpm uiq run ...</text>
