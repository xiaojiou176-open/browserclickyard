name: Weekly Gate

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      run_manual_observability:
        description: Run optional Gemini, live, mutation, and AI weekly checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UIQ_HEARTBEAT_INTERVAL_SEC: "60"

jobs:
  weekly-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@bab023d7a2c8eef4351fc96992dc6d83c9561bb2
        with:
          clean: true
          persist-credentials: false
      - name: Activate pnpm from root packageManager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Containerized weekly deterministic governance core
        env:
          UIQ_CONTAINER_GATE_SERVICE_OVERRIDE: ci-browser
          UIQ_CONTAINER_GATE_BUILD_OVERRIDE: ci-browser
          UIQ_CONTAINER_GATE_COMMAND_OVERRIDE: |
            bash scripts/ci/run-weekly-deterministic-core.sh
        run: bash scripts/ci/run-gate-in-container.sh exec
      - name: Upload test truthiness gate artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uiq-weekly-test-truth-gate
          path: |
            .runtime-cache/artifacts/ci/uiq-test-truth-gate-weekly.json
            .runtime-cache/artifacts/ci/uiq-test-truth-gate-weekly.md
          if-no-files-found: warn
      - name: Upload Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uiq-weekly-run
          path: |
            .runtime-cache/artifacts/ci/
            .runtime-cache/artifacts/config/env-reduction-report.json
            .runtime-cache/artifacts/config/env-reduction-report.md
          retention-days: 14
          if-no-files-found: warn

  weekly-manual-observability:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_manual_observability }}
    needs: weekly-gate
    runs-on: ubuntu-latest
    environment: owner-approved-sensitive
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@bab023d7a2c8eef4351fc96992dc6d83c9561bb2
        with:
          clean: true
          persist-credentials: false
      - name: Activate pnpm from root packageManager
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
      - name: Gemini-only policy report (manual weekly)
        run: bash scripts/ci/gemini-only-policy.sh --report
      - name: Require Gemini secret (weekly manual observability)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::GEMINI_API_KEY is required for weekly manual observability."
            exit 1
          fi
      - name: Provider readiness gate (manual, secret-backed)
        env:
          VIDEO_ANALYZER_PROVIDER: "gemini"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ai/check-provider-readiness.mjs --strict
      - name: Live external web verification (manual weekly)
        env:
          UIQ_LIVE_EXTERNAL_ENABLED: "true"
          UIQ_LIVE_EXTERNAL_URL: ${{ vars.UIQ_LIVE_EXTERNAL_URL || 'https://example.com' }}
        run: pnpm test:live:web
      - name: Live LLM verification (manual weekly)
        env:
          UIQ_LIVE_LLM_ENABLED: "true"
        run: pnpm test:live:llm
      - name: Mutation gate (manual weekly)
        run: pnpm mutation:effective
      - name: Weekly real backend MCP verification (manual)
        env:
          UIQ_ENABLE_REAL_BACKEND_TESTS: "true"
        run: pnpm test:mcp-server:real
      - name: Test truthiness gate
        run: node scripts/ci/uiq-test-truth-gate.mjs --profile weekly --strict true
      - name: Run Weekly Profile
        env:
          UIQ_GEMINI_PARALLEL_CONSISTENCY: "6"
          UIQ_CONTAINER_GATE_SERVICE_OVERRIDE: ci-browser
          UIQ_CONTAINER_GATE_BUILD_OVERRIDE: ci-browser
          UIQ_CONTAINER_GATE_COMMAND_OVERRIDE: |
            set -euo pipefail
            run_log=".runtime-cache/logs/ci/weekly-run.log"
            run_id_file=".runtime-cache/artifacts/ci/weekly-run-id.txt"
            mkdir -p .runtime-cache/logs/ci .runtime-cache/artifacts/ci
            set -o pipefail
            pnpm uiq run --profile weekly --target web.ci | tee "$run_log"
            run_id="$(grep -E '^runId=' "$run_log" | tail -n1 | cut -d'=' -f2)"
            if [[ -z "$run_id" ]]; then
              echo "::error::Weekly profile run did not emit runId="
              exit 1
            fi
            printf '%s\n' "$run_id" > "$run_id_file"
            node scripts/ci/verify-run-evidence.mjs --profile weekly --run-id "$run_id"
        run: bash scripts/ci/run-gate-in-container.sh exec
      - name: Upload weekly mutation reports (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: weekly-mutation-reports
          path: |
            .runtime-cache/reports/mutation/
          if-no-files-found: warn
      - name: Preflight Gemini report artifact (weekly, fail-fast)
        run: |
          set -euo pipefail
          RUN_ID_FILE=".runtime-cache/artifacts/ci/weekly-run-id.txt"
          if [[ ! -f "$RUN_ID_FILE" ]]; then
            echo "::error::Gemini preflight failed: run-id file missing: $RUN_ID_FILE"
            exit 1
          fi
          RUN_ID="$(cat "$RUN_ID_FILE")"
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Gemini preflight failed: empty run id"
            exit 1
          fi
          REPORT_PATH=".runtime-cache/artifacts/runs/${RUN_ID}/reports/ui-ux-gemini-report.json"
          if [[ ! -f "$REPORT_PATH" ]]; then
            echo "::error::Gemini preflight failed: report missing: $REPORT_PATH"
            exit 1
          fi
          node - "$REPORT_PATH" <<'JS'
          const fs = require("fs");
          const p = process.argv[2];
          JSON.parse(fs.readFileSync(p, "utf8"));
          console.log("[gemini-preflight] readable report: " + p);
          JS
      - name: Gemini accuracy gate (weekly strict via profile thresholds)
        run: node scripts/ci/uiq-gemini-accuracy-gate.mjs --profile weekly --strict true
      - name: Gemini concurrency gate (weekly strict via profile thresholds)
        run: node scripts/ci/uiq-gemini-concurrency-gate.mjs --profile weekly --strict true
      - name: Flake budget gate (strict for weekly)
        run: node scripts/ci/uiq-flake-budget.mjs --profile weekly --strict true --dynamic-baseline false
      - name: SLA + failure cluster summary (weekly)
        run: node scripts/ci/uiq-sla-and-clusters.mjs --profile weekly
      - name: Failure ticketing clusters (weekly)
        env:
          UIQ_AUTO_TICKETING: ${{ env.UIQ_AUTO_TICKETING || vars.UIQ_AUTO_TICKETING || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          EMIT="${UIQ_AUTO_TICKETING:-false}"
          node scripts/ci/uiq-failure-ticketing.mjs \
            --runs-dir .runtime-cache/artifacts/runs \
            --out-dir .runtime-cache/artifacts/ci \
            --top-n 25 \
            --sample-limit 5 \
            --emit-gh-issues "$EMIT" \
            --emit-pr-comment false \
            --repo "${GITHUB_REPOSITORY}"
      - name: AI review (weekly, manual high+)
        run: bash scripts/lib/node-bin.sh tsx scripts/ci/uiq-ai-review.mjs --profile weekly --strict true --severity-threshold high --max-artifacts 40 --emit-issue false --emit-pr-comment false
      - name: Upload AI review artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uiq-weekly-ai-review
          path: |
            .runtime-cache/artifacts/ci/uiq-ai-review-weekly.json
            .runtime-cache/artifacts/ci/uiq-ai-review-weekly.md
          if-no-files-found: warn
      - name: Cross-target benchmark report (weekly)
        run: node scripts/ci/uiq-cross-target-benchmark.mjs --runs-dir .runtime-cache/artifacts/runs --out-dir .runtime-cache/artifacts/ci --profile weekly --lookback-days 30 --limit 200 --targets web,tauri,swift
      - name: Generate Release Notes (non-blocking)
        run: ./scripts/release/generate-release-notes.sh
        continue-on-error: true
      - name: Upload Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: uiq-weekly-manual-observability
          path: |
            .runtime-cache/artifacts/runs/
            .runtime-cache/artifacts/ci/
            .runtime-cache/artifacts/config/env-reduction-report.json
            .runtime-cache/artifacts/config/env-reduction-report.md
          retention-days: 14
          if-no-files-found: warn
      - name: Upload Release Notes Artifact (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-notes-vnext
          path: .runtime-cache/artifacts/release/release-notes-vnext.md
          if-no-files-found: warn
