name: Setup Playwright
description: Restore Playwright browser cache and install browser binaries.
inputs:
  lockfile-path:
    description: Lockfile path used in cache key.
    required: false
    default: pnpm-lock.yaml
  cache-key-suffix:
    description: Cache key suffix to isolate project scope.
    required: false
    default: root
  browser:
    description: Browser channel to install.
    required: false
    default: chromium
  install-deps:
    description: Whether to install browser system dependencies.
    required: false
    default: "true"
  working-directory:
    description: Working directory for playwright install.
    required: false
    default: .
  restore-cache:
    description: Whether to restore Playwright browser cache.
    required: false
    default: "false"
outputs:
  browser-cache-path:
    description: Resolved Playwright browser cache directory.
    value: ${{ steps.prepare-browser-path.outputs.browser_cache }}
runs:
  using: composite
  steps:
    - name: Prepare Playwright browser path
      id: prepare-browser-path
      shell: bash
      env:
        INPUT_CACHE_KEY_SUFFIX: ${{ inputs.cache-key-suffix }}
      run: |
        browser_cache="${RUNNER_TEMP}/uiq-ms-playwright/${INPUT_CACHE_KEY_SUFFIX}"
        mkdir -p "$browser_cache"
        # Remove stale partial extractions from previous runs to avoid tar collisions.
        rm -rf "$browser_cache"/*
        echo "browser_cache=$browser_cache" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browser cache
      if: ${{ inputs.restore-cache == 'true' }}
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ steps.prepare-browser-path.outputs.browser_cache }}
        key: ${{ runner.os }}-playwright-${{ inputs.cache-key-suffix }}-${{ inputs.browser }}-${{ hashFiles(inputs.lockfile-path) }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ inputs.cache-key-suffix }}-${{ inputs.browser }}-
          ${{ runner.os }}-playwright-${{ inputs.cache-key-suffix }}-
    - name: Install Playwright browser
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_BROWSER: ${{ inputs.browser }}
        INPUT_INSTALL_DEPS: ${{ inputs.install-deps }}
        PLAYWRIGHT_BROWSERS_PATH: ${{ steps.prepare-browser-path.outputs.browser_cache }}
      run: |
        if [[ "$INPUT_INSTALL_DEPS" == "true" && "${{ runner.os }}" == "Linux" ]]; then
          bash scripts/lib/node-bin.sh playwright install --with-deps "$INPUT_BROWSER"
        else
          bash scripts/lib/node-bin.sh playwright install "$INPUT_BROWSER"
        fi
