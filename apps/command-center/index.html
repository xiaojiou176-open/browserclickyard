<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Browserclickyard is an AI-native WebUI stress lab for localhost-first browser experiments, with governed proof and agent-ready workflows when results need deeper review."
    />
    <meta property="og:title" content="Browserclickyard | AI-native WebUI stress lab" />
    <meta
      property="og:description"
      content="Browserclickyard is an AI-native WebUI stress lab for localhost-first browser experiments, with governed proof and agent-ready workflows when results need deeper review."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://xiaojiou176-open.github.io/browserclickyard/assets/browserclickyard-social-preview.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Browserclickyard | AI-native WebUI stress lab" />
    <meta
      name="twitter:description"
      content="Browserclickyard is an AI-native WebUI stress lab for localhost-first browser experiments, with governed proof and agent-ready workflows when results need deeper review."
    />
    <meta
      name="twitter:image"
      content="https://xiaojiou176-open.github.io/browserclickyard/assets/browserclickyard-social-preview.jpg"
    />
    <title>Browserclickyard | AI-native WebUI stress lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      #root {
        min-height: 100vh;
      }
      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          14px/1.4 "IBM Plex Sans",
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #6b7280;
        background: #fff;
      }
      .boot-dot {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid #d1d5db;
        border-top-color: #1d4ed8;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-row {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot-shell {
          background: #0f172a;
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <span class="boot-row"><span class="boot-dot"></span>Initializing page...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
