schema_version: 3
runtime_root: .runtime-cache
retention_tiers:
  evidence_keep:
    auto_gc_default: false
    description: Canonical run, release, and audit evidence that should stay out of routine runtime GC unless a higher-level retention policy explicitly says otherwise.
  disposable_generated:
    auto_gc_default: true
    description: Generated reports, logs, and QA byproducts that are safe to regenerate and may participate in routine runtime GC.
  runtime_state:
    auto_gc_default: false
    description: Stateful runtime ledgers or active execution surfaces that require TTL and active-use validation before cleanup.
  scratch:
    auto_gc_default: true
    description: Ephemeral cache, temp, and bridge outputs that may be aggressively cleaned once they are no longer in active use.
runtime_classes:
  - id: logs
    path: logs
    owner: runtime
    purpose: structured runtime logs, dev process logs, and CI/test log bundles
    retention_days: 7
    archiveable: false
    cleanup_scope: logs
    retention_tier: runtime_state
  - id: artifacts
    path: artifacts
    owner: orchestrator
    purpose: canonical run bundles, CI artifacts, and machine-readable evidence
    retention_days: 30
    archiveable: true
    cleanup_scope: runs
    retention_tier: evidence_keep
  - id: cache
    path: cache
    owner: runtime
    purpose: repo-level transient cache files and cleanup markers
    retention_days: 7
    archiveable: false
    cleanup_scope: cache
    retention_tier: scratch
  - id: reports
    path: reports
    owner: qa-platform
    purpose: generated report surfaces that are not promoted into run bundles
    retention_days: 14
    archiveable: true
    cleanup_scope: extras
    retention_tier: evidence_keep
  - id: temp
    path: temp
    owner: runtime
    purpose: temp-only execution scratch space that can be dropped after each run
    retention_days: 1
    archiveable: false
    cleanup_scope: extras
    retention_tier: scratch
  - id: dev
    path: dev
    owner: runtime
    purpose: dev-up pid files, port markers, and runtime-gc preflight state for the current local stack
    retention_days: 7
    archiveable: false
    cleanup_scope: extras
    retention_tier: runtime_state
  - id: metrics
    path: metrics
    owner: runtime
    purpose: GC state, RUM summary, and cache lifecycle telemetry
    retention_days: 14
    archiveable: true
    cleanup_scope: extras
    retention_tier: runtime_state
  - id: backups
    path: backups
    owner: runtime
    purpose: runtime cache snapshots for rollback and incident preservation
    retention_days: 30
    archiveable: true
    cleanup_scope: backups
    retention_tier: evidence_keep
  - id: automation
    path: automation
    owner: services/api/universal-platform
    purpose: automation sessions, task state, lifecycle state, generated runtime-side data, and transient pytest-created automation leftovers under pytest-* directories
    retention_days: 14
    archiveable: true
    cleanup_scope: automation
    retention_tier: runtime_state
  - id: coverage
    path: coverage
    owner: qa-platform
    purpose: canonical coverage artifacts for frontend, apps-web, and backend
    retention_days: 7
    archiveable: true
    cleanup_scope: extras
    retention_tier: disposable_generated
  - id: container_gates
    path: container-gates
    owner: ci-platform
    purpose: container gate summaries plus run-scoped host bridge metadata; runner-temp/node/python/browser bridge roots must be dropped after successful runs and stale run directories age out after 3 days
    retention_days: 3
    archiveable: true
    cleanup_scope: extras
    retention_tier: disposable_generated
  - id: container_runs
    path: container-runs
    owner: ci-platform
    purpose: per-run runner-temp bridges for node_modules, pnpm store, python env, and browser state
    retention_days: 3
    archiveable: false
    cleanup_scope: extras
    retention_tier: scratch
  - id: docs_gate
    path: docs-gate
    owner: docs-governance
    purpose: docs gate logs grouped by run id
    retention_days: 7
    archiveable: true
    cleanup_scope: extras
    retention_tier: disposable_generated
  - id: lint_all
    path: lint-all
    owner: qa-platform
    purpose: lint-all logs grouped by run id
    retention_days: 7
    archiveable: true
    cleanup_scope: extras
    retention_tier: disposable_generated
  - id: pytest_cache
    path: pytest-cache
    owner: backend
    purpose: canonical pytest cache relocated under runtime root
    retention_days: 7
    archiveable: false
    cleanup_scope: extras
    retention_tier: scratch
  - id: test-output
    path: test-output
    owner: qa-platform
    purpose: sqlite databases and intermediate state for services/api/integration/frontend nonstub tests
    retention_days: 7
    archiveable: false
    cleanup_scope: extras
    retention_tier: runtime_state
  - id: test-results
    path: test-results
    owner: qa-platform
    purpose: Playwright raw result bundles for frontend and harness e2e/ct runs
    retention_days: 7
    archiveable: true
    cleanup_scope: extras
    retention_tier: disposable_generated
machine_cache_must_live_outside_repo:
  - pnpm store
  - uv cache
  - pip cache
  - Playwright browser download cache
repo_runtime_outputs:
  - class: coverage
    canonical_paths:
      - .runtime-cache/coverage
      - .runtime-cache/coverage/backend-coverage.xml
      - .runtime-cache/coverage/apps/command-center/lcov.info
      - .runtime-cache/coverage/apps-web/lcov.info
    blocked_root_paths:
      - .coverage
      - coverage
      - coverage.xml
      - htmlcov
  - class: mutation
    canonical_paths:
      - .runtime-cache/reports/mutation
      - .runtime-cache/reports/mutation/latest-summary.json
      - .runtime-cache/temp/mutation-workspaces/py
    blocked_root_paths:
      - .mutmut-cache
      - mutants
      - stryker.log
  - class: e2e
    canonical_paths:
      - .runtime-cache/test-results
      - .runtime-cache/reports/playwright
      - .runtime-cache/logs/frontend-e2e
    blocked_root_paths:
      - test-results
      - playwright-report
  - class: transient_python
    canonical_paths:
      - .runtime-cache/temp
      - .runtime-cache/pytest-cache
    blocked_root_paths:
      - ui_automation_control_plane.egg-info
      - .pytest_cache
  - class: gate_logs
    canonical_paths:
      - .runtime-cache/docs-gate
      - .runtime-cache/lint-all
      - .runtime-cache/container-gates
    blocked_root_paths:
      - docs-gate
      - lint-all
      - container-gates
  - class: automation_runtime
    canonical_paths:
      - .runtime-cache/automation
      - .runtime-cache/logs/automation
    blocked_root_paths:
      - automation-runtime
  - class: test_state
    canonical_paths:
      - .runtime-cache/test-output
    blocked_root_paths:
      - test-output
legacy_published_artifacts: []
cleanup_commands:
  - ./scripts/runtime-gc.sh --scope all --retention-days 7 --keep-runs 50 --max-log-size-mb 64 --log-tail-lines 4000
  - ./scripts/cleanup-runtime.sh --apply
  - ./scripts/cleanup-runtime.sh --dry-run --target .runtime-cache/container-gates --ttl-hours 72
  - ./scripts/cleanup-runtime.sh --apply --target .runtime-cache/container-gates --ttl-hours 72
  - ./scripts/cleanup-runtime.sh --dry-run --target .runtime-cache/container-runs --ttl-hours 72
  - ./scripts/cleanup-runtime.sh --apply --target .runtime-cache/container-runs --ttl-hours 72
  - ./scripts/backup-runtime.sh
cleanup_command_notes:
  - ./scripts/runtime-gc.sh --scope all only touches logs, runs, cache, backups, and extras in scratch/disposable_generated tiers.
  - ./scripts/runtime-gc.sh --scope automation only removes pytest-* leftovers under .runtime-cache/automation.
  - ./scripts/cleanup-runtime.sh refuses runtime_state and evidence_keep directories even when directly targeted.
  - ./scripts/cleanup-runtime.sh --target .runtime-cache/container-gates keeps canonical summaries in place while pruning stale run directories older than 72 hours.
  - ./scripts/cleanup-runtime.sh --target .runtime-cache/container-runs prunes stale runner-temp bridges and docker-config sidecars older than 72 hours.
repro_without_cache_command: bash scripts/ci/check-mainline-repro-without-cache.sh
space_audit:
  ownership_classes:
    - repo-owned
    - workspace-shared
    - machine-shared
    - unknown
  buckets:
    - safe
    - cautious
    - verify-first
    - do-not-touch
  internal_bucket_rules:
    safe:
      - type: recursive_dir_name
        root: services/api
        name: __pycache__
        reason: Python bytecode cache under service source tree.
      - type: path
        path: .runtime-cache/pytest-cache
        reason: Relocated pytest cache under runtime root.
      - type: path
        path: .runtime-cache/container-runs
        reason: Per-run runner-temp bridges are disposable once a gate succeeds and become TTL cleanup targets after a short-lived diagnostics window.
    cautious:
      - type: path
        path: .runtime-cache/lint-all
        reason: Generated lint/typecheck logs that are reproducible but still useful during active debugging.
      - type: path
        path: .runtime-cache/coverage
        reason: Canonical coverage outputs that are reproducible but often inspected during the current verification loop.
      - type: path
        path: .runtime-cache/container-gates
        reason: Container gate summaries and state breadcrumbs stay available for short-lived diagnosis windows before the 3-day maintenance TTL applies.
    verify-first:
      - type: path
        path: .git/cursor/crepe
        reason: Non-standard local index payload that looks regenerable but needs producer confirmation before cleanup.
      - type: path
        path: services/api/mutants
        reason: Legacy Python mutation workspace residue; source-tree mutants are forbidden steady-state artifacts and must migrate under governed runtime paths.
      - type: path
        path: .runtime-cache/test-output
        reason: Intermediate sqlite/test state with runtime-state semantics.
      - type: path
        path: .runtime-cache/reports
        reason: Generated report surfaces that may still be referenced by the current verification trail.
      - type: path
        path: .runtime-cache/automation
        reason: Runtime-ledger state that needs active-use confirmation before cleanup.
    do-not-touch:
      - type: path
        path: .git/objects
        reason: Canonical Git object storage, not a disposable runtime cache.
  external_layers:
    - id: repo_node_modules_root
      ownership_class: repo-owned
      bucket: verify-first
      confidence: high
      attributable_bytes: true
      candidate_paths:
        - node_modules
      reason: Repo-local authoritative Node root selected by .npmrc modules-dir; rebuildable via repo-native install and no longer allowed to spill into the parent workspace.
    - id: runtime_bridge_node_root
      ownership_class: workspace-shared
      bucket: verify-first
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - /tmp/uiq-runner/uiq-node-modules
      reason: Active execution bridge that mirrors shared Node dependencies into runner temp and must stay aligned with shared_dependency_contract.runtime_bridge_root.
    - id: uiq_node_modules_fallback
      ownership_class: workspace-shared
      bucket: do-not-touch
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - ${XDG_CACHE_HOME:-$HOME/.cache}/uiq/node-modules
      reason: Repo-family fallback Node cache used when no workspace-specific override is exported.
    - id: uiq_python_env
      ownership_class: unknown
      bucket: verify-first
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - ${XDG_CACHE_HOME:-$HOME/.cache}/uiq/python-env
      reason: Repo-family fallback Python environment that may be shared across related checkouts.
    - id: playwright_browser_cache
      ownership_class: machine-shared
      bucket: do-not-touch
      confidence: high
      attributable_bytes: false
      candidate_paths:
        - ${HOME}/Library/Caches/ms-playwright
        - ${XDG_CACHE_HOME:-$HOME/.cache}/ms-playwright
      reason: Browser download cache shared by multiple repos and package roots.
    - id: uv_cache
      ownership_class: machine-shared
      bucket: do-not-touch
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - ${XDG_CACHE_HOME:-$HOME/.cache}/uv
      reason: Machine-level uv cache used by Python bootstrap flows.
    - id: corepack_cache
      ownership_class: machine-shared
      bucket: do-not-touch
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - ${XDG_CACHE_HOME:-$HOME/.cache}/node/corepack
      reason: Machine-level corepack bootstrap cache.
    - id: npm_cacache
      ownership_class: machine-shared
      bucket: verify-first
      confidence: medium
      attributable_bytes: false
      candidate_paths:
        - ${HOME}/.npm/_cacache
      reason: Shared npm download cache with repo relevance but no single-repo attribution.
    - id: docker_cli_config
      ownership_class: machine-shared
      bucket: do-not-touch
      confidence: high
      attributable_bytes: false
      candidate_paths:
        - ${HOME}/.docker
      reason: Machine Docker CLI config read by containerized repo flows.
    - id: docker_desktop_data
      ownership_class: machine-shared
      bucket: do-not-touch
      confidence: low
      attributable_bytes: false
      candidate_paths:
        - ${HOME}/Library/Containers/com.docker.docker
      reason: Docker Desktop data used by repo flows but not attributable to this repo alone.
    - id: uiq_pnpm_virtual_store
      ownership_class: unknown
      bucket: verify-first
      confidence: low
      attributable_bytes: false
      candidate_paths:
        - ${XDG_CACHE_HOME:-$HOME/.cache}/pnpm/uiq-platform-repo
      reason: UIQ-family pnpm virtual store that may be historical or shared.
