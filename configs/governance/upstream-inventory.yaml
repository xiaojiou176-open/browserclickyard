    display_name: "@modelcontextprotocol/sdk"
    category: protocol
    source_type: package
    locator_type: package
    locator_value: "@modelcontextprotocol/sdk@1.26.0"
    version_pin_kind: exact-version
    integration_owner: uiq-platform
    upgrade_owner: uiq-platform
    contract_type: public_contract
    contract_surface:
      - MCP tool registration
      - run artifact read helpers
    glue_layers:
      - services/mcp-server
      - packages/orchestrator
    validation_commands:
      - pnpm mcp:test
      - pnpm mcp:smoke
    validation_profile: ci
    ci_mapping:
      required_gate: mcp_real_backend_gate
      workflow: .github/workflows/ci.yml
    upgrade_trigger: monthly tooling review or security advisory
    rollback_path: revert package bump and rerun mcp:test plus mcp:smoke
    failure_attribution: repo glue failure vs MCP SDK contract drift vs local runtime wiring
    provenance: pnpm-lock pinned package resolved from root workspace
    sync_policy: version pinned in root package.json and validated on every MCP contract change
    local_tracking_path: services/mcp-server
    customizations: []
    private_coupling_forbidden_patterns:
      - "@modelcontextprotocol/sdk/.*/dist"
      - "@modelcontextprotocol/sdk/.*/src"
