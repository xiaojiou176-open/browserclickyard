    default: false
    required: false
    sensitive: false
    description: Allow localhost token bypass for local development only.
  - name: AUTOMATION_EMERGENCY_KILL_SWITCH
    section: auth
    default: false
    required: false
    sensitive: false
    description: Emergency stop for mutating automation APIs (POST/PUT/PATCH/DELETE).
