version: 1
description: Canonical env-variable contract for this repository.
allow_undeclared_exact:
  - AGENT_TOOLSDIRECTORY
  - ABORT_COMMAND
  - __STRYKER_ACTIVE_MUTANT__
  - CI
  - CHROME_PATH
  - COMMAND_TOWER_EVIDENCE_MAX_BYTES
  - COMMAND_TOWER_EVIDENCE_TIMELINE_DEFAULT_LIMIT
  - COMMAND_TOWER_EVIDENCE_TIMELINE_MAX_LIMIT
  - GITHUB_ACTIONS
  - GITHUB_BASE_REF
  - GITHUB_EVENT_NAME
  - GITHUB_REF
  - GITHUB_REPOSITORY
  - GITHUB_STEP_SUMMARY
  - GITHUB_WORKSPACE
  - HOME
  - LANG
  - LAST_RUN_AT
  - LC_ALL
  - LINE_LIMIT
  - MAX_BEHIND
  - PATH
  - PYTEST_CURRENT_TEST
  - PYTEST_XDIST_WORKER
  - RUNTIME_CACHE_DIR
  - RUNTIME_LOG_DIR
  - ROOT_DIR
  - RUNNER_TOOL_CACHE
  - SCOPE
  - STARTED_AT
  - STATE_PATH
  - STATUS
  - STRATEGY
  - SYNC_BRANCH_DATE
  - TERM
  - TRACING_ENABLED
  - TRACING_EXPORTER
  - TRACING_OTLP_ENDPOINT
  - TRACING_OTLP_HEADERS
  - TRACING_SERVICE_NAME
allow_undeclared_prefixes:
  - AI_REVIEW_
  - AUTOMATION_GLOBAL_
  - AUTOMATION_RUNTIME_
  - GEMINI_
  - GOOGLE_
  - npm_
  - PNPM_
  - PLAYWRIGHT_
  - RECON_
  - TM_
  - UIQ_
  - VITE_
variables:
  - name: APP_ENV
    section: core
    default: development
    required: false
    sensitive: false
    description: Runtime environment name.
  - name: LOG_LEVEL
    section: core
    default: DEBUG
    required: false
    sensitive: false
    description: Backend log level.
  - name: LOG_MAX_BYTES
    section: core
    default: 5242880
    required: false
    sensitive: false
    description: Per-log-file max size in bytes.
  - name: LOG_BACKUP_COUNT
    section: core
    default: 5
    required: false
    sensitive: false
    description: Number of rotated log files.
  - name: CORS_ALLOWED_ORIGINS
    section: core
    default: http://127.0.0.1:17373,http://localhost:17373
    required: false
    sensitive: false
    description: Comma-separated CORS origin allowlist.
  - name: TRUSTED_HOSTS
    section: core
    default: 127.0.0.1,localhost,testserver
    required: false
    sensitive: false
    description: Comma-separated trusted host allowlist.
  - name: COOKIE_SECURE
    section: core
    default: true
    required: false
    sensitive: false
    description: Set secure cookie policy.
  - name: CSRF_TTL_SECONDS
    section: core
    default: 900
    required: false
    sensitive: false
    description: CSRF token TTL in seconds.
  - name: FRONTEND_REGISTER_URL
    section: core
    default: ""
    required: false
    sensitive: false
    description: Optional frontend register URL override.

  - name: AUTOMATION_API_TOKEN
    section: auth
    default: replace-with-strong-token
    required: true
    sensitive: true
    description: Shared API token used by automation endpoints; placeholders and
      weak values are rejected fail-fast (min length 16).
